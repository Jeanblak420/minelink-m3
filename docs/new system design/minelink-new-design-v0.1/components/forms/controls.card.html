<!-- @dsCard group="Components" viewport="700x360" name="Forms — Controls" subtitle="Switch, Checkbox, Radio, Segmented, File upload" -->
<!DOCTYPE html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet">
<style>body{margin:0;background:var(--surface-app);padding:22px;font-family:var(--font-sans)}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:22px;align-items:start}
  .lab{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--text-faint);font-weight:600;margin:0 0 10px}
  .card{background:var(--surface-card);border:1px solid var(--border-card);border-radius:16px;padding:18px}
</style></head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel">
const { Switch, Checkbox, RadioGroup, Segmented, FileUpload } = window.MineLinkDesignSystem_9acfde;
function Demo(){
  const [on,setOn]=React.useState(true);const [ck,setCk]=React.useState(true);
  const [rd,setRd]=React.useState('account');const [seg,setSeg]=React.useState('30 days');
  return (<div className="grid">
    <div><p className="lab">Switch</p><div className="card" style={{display:'flex',flexDirection:'column',gap:6}}>
      <Switch checked={on} onChange={setOn} label="24 hours" hint="Mine operates continuously"/>
      <Switch checked={!on} onChange={()=>setOn(!on)} label="Ongoing" hint="No fixed period"/>
    </div></div>
    <div><p className="lab">Checkbox</p><div className="card" style={{display:'flex',flexDirection:'column',gap:6}}>
      <Checkbox checked={ck} onChange={setCk} label="Confirm tonnage is correct"/>
      <Checkbox indeterminate label="Select all trucks" hint="3 of 6 selected"/>
    </div></div>
    <div><p className="lab">Radio group</p><div className="card">
      <RadioGroup value={rd} onChange={setRd} options={[{value:'account',label:'On account',hint:'Diesel billed to buyer'},{value:'transporter',label:'On transporter'}]}/>
    </div></div>
    <div><p className="lab">Segmented</p><div className="card" style={{display:'flex',flexDirection:'column',gap:14}}>
      <Segmented value={seg} onChange={setSeg} options={['50/50','Daily','7 days','30 days']}/>
      <FileUpload label="Proof of delivery" capture hint="Photo of signed waybill"/>
    </div></div>
  </div>);
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script>
</body></html>
