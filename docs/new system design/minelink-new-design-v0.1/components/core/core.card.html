<!-- @dsCard group="Components" viewport="700x430" name="Core" subtitle="Buttons, badges, stat & feature cards, avatars, plates" -->
<!DOCTYPE html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet">
<style>body{margin:0;background:var(--surface-app);padding:22px;font-family:var(--font-sans)}
  .lab{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--text-faint);font-weight:600;margin:0 0 10px}
  .sec{margin-bottom:22px}
  .row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
  .grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
</style></head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel">
const { Button, StatusBadge, StatCard, FeatureCard, Avatar, PlatePill } = window.MineLinkDesignSystem_9acfde;
function Demo(){
  return (<>
    <div className="sec"><p className="lab">Buttons</p><div className="row">
      <Button variant="primary" iconRight="arrow_forward">Open</Button>
      <Button variant="go" icon="login">Mark Arrived</Button>
      <Button variant="leave" icon="logout">Mark Left</Button>
      <Button variant="outline">Cancel</Button>
      <Button variant="ghost" icon="more_horiz">More</Button>
    </div></div>
    <div className="sec"><p className="lab">Status badges &amp; plates</p><div className="row">
      <StatusBadge tone="transit">OTW TO LOADING</StatusBadge>
      <StatusBadge tone="atmine">AT MINE</StatusBadge>
      <StatusBadge tone="done">LOADED</StatusBadge>
      <StatusBadge tone="warn">MAINTENANCE</StatusBadge>
      <PlatePill>CDF 789 LP</PlatePill>
      <Avatar name="Eli Buyer" />
    </div></div>
    <div className="sec"><p className="lab">Stat cards</p><div className="grid4">
      <StatCard icon="local_shipping" label="Total Fleet" value="6" tone="cyan"/>
      <StatCard icon="bolt" label="On Trip" value="3" tone="blue"/>
      <StatCard icon="alt_route" label="Active Trips" value="3" tone="cyan"/>
      <StatCard icon="inventory_2" label="Tons Delivered" value="33.2" unit="t" delta="12.5t" tone="green"/>
    </div></div>
    <div className="sec"><p className="lab">Feature cards</p><div className="grid2">
      <FeatureCard icon="alt_route" title="Routes &amp; Mines" description="View active routes across mines and offload points." tone="cyan"/>
      <FeatureCard icon="balance" title="Reconciliations" description="Recons per mine, per route, or across all operations." tone="amber"/>
    </div></div>
  </>);
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script>
</body></html>
