<!-- @dsCard group="States & Account" viewport="1200x760" name="Status & Account screens" subtitle="Waiting-for-role, declined, expired, password, workspace picker, profile" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><title>MineLink — Status & Account screens</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../../styles.css">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet">
<style>html,body{margin:0;height:100%}body{background:var(--surface-app)}#root{height:100vh}</style>
</head><body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel" src="screens.jsx"></script>
<script type="text/babel">
const S = window.StateScreens;
const SCREENS = [
  ['waiting', 'Waiting for role', () => <S.WaitingForRole/>],
  ['declined', 'Request declined', () => <S.RequestDeclined/>],
  ['expired', 'Expired access', () => <S.ExpiredAccess/>],
  ['mandatory', 'Mandatory password', () => <S.MandatoryPasswordChange/>],
  ['reset', 'Reset password', () => <S.ResetPassword/>],
  ['workspace', 'Choose workspace', () => <S.CompanySelection/>],
  ['profile', 'Profile & security', () => <div style={{padding:28}}><S.OrgProfile/></div>],
];
function App(){
  const [k, setK] = React.useState('waiting');
  const cur = SCREENS.find(s => s[0] === k);
  return <div style={{height:'100%',display:'flex',flexDirection:'column',fontFamily:'var(--font-sans)'}}>
    <div style={{display:'flex',gap:6,padding:'12px 16px',background:'var(--surface-card)',borderBottom:'1px solid var(--divider)',flexWrap:'wrap'}}>
      {SCREENS.map(([key,label]) => (
        <button key={key} onClick={()=>setK(key)} style={{padding:'7px 13px',borderRadius:999,border:`1px solid ${k===key?'var(--accent)':'var(--border-strong)'}`,background:k===key?'var(--accent)':'var(--surface-card)',color:k===key?'#fff':'var(--text-body)',fontFamily:'var(--font-sans)',fontSize:12.5,fontWeight:700,cursor:'pointer'}}>{label}</button>
      ))}
    </div>
    <div style={{flex:1,minHeight:0,overflowY:'auto'}}>{cur[2]()}</div>
  </div>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
<script src="../shared/appearance.js"></script>
</body></html>
