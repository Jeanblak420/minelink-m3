<!DOCTYPE html><html><head><meta charset="utf-8"><title>MineLink — Coming Soon</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../../styles.css">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet">
<style>html,body{margin:0;height:100%}body{background:var(--surface-app)}#root{height:100vh}</style>
</head><body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel" src="../shared/shell.jsx"></script>
<script type="text/babel" src="screens.jsx"></script>
<script type="text/babel">
const { PortalShell } = window.MLShell;
const S = window.ComingSoonScreens;
const NAV = [
  { key: 'overview', label: 'Dashboard', icon: 'dashboard' },
  { key: 'market', label: 'Marketplace', icon: 'storefront', badge: 'Soon' },
  { key: 'invoices', label: 'Invoices', icon: 'receipt_long', badge: 'Soon' },
  { key: 'hr', label: 'Employees / HR', icon: 'badge', badge: 'Soon' },
];
const META = {
  market: { title: 'Marketplace', subtitle: 'List & buy minerals · invoicing', comp: <S.MarketplaceComingSoon/> },
  invoices: { title: 'Invoices', subtitle: 'Proforma & tax invoices', comp: <S.MarketplaceComingSoon/> },
  hr: { title: 'Employees / HR', subtitle: 'Onboarding, roles & dismissal', comp: <S.HrComingSoon/> },
};
function App(){
  const [tab, setTab] = React.useState('market');
  const m = META[tab] || META.market;
  return <PortalShell brand="MineLink" sectionLabel="MINE" nav={NAV} active={tab} onNav={setTab}
    chatUnread={5} onOpenChat={() => window.location.href='../chat/index.html'}
    user={{ name: 'Iron Hills Mining', role: 'Mine / Supplier' }} title={m.title} subtitle={m.subtitle}>{m.comp}</PortalShell>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
<script src="../shared/appearance.js"></script>
</body></html>
