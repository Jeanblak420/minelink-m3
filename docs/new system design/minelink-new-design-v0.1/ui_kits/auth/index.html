<!-- @dsCard group="Auth" viewport="1440x900" name="Login & Onboarding" subtitle="Sign in, WhatsApp OTP, reset & org registration" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><title>MineLink — Sign in</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../../styles.css">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet">
<style>html,body{margin:0;height:100%}body{background:var(--surface-app)}#root{height:100vh}</style>
</head><body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel" src="screens.jsx"></script>
<script type="text/babel">
const S = window.AuthScreens;
function App(){
  const [tab, setTab] = React.useState('login');
  const go = (t) => { if (t === 'app') { setTab('done'); return; } setTab(t); };
  if (tab === 'done') return (
    <div style={{height:'100%',display:'flex',alignItems:'center',justifyContent:'center',flexDirection:'column',gap:18,fontFamily:'var(--font-sans)',background:'var(--surface-app)'}}>
      <div style={{width:64,height:64,borderRadius:18,background:'var(--ml-well-green)',display:'flex',alignItems:'center',justifyContent:'center'}}><span className="material-symbols-rounded" style={{fontFamily:"'Material Symbols Rounded'",fontSize:34,color:'var(--ml-green-600)'}}>check_circle</span></div>
      <div style={{fontSize:20,fontWeight:800,color:'var(--text-strong)'}}>Signed in — routing to your portal…</div>
      <button onClick={()=>setTab('login')} style={{border:'1px solid var(--border-strong)',background:'var(--surface-card)',borderRadius:'var(--radius-md)',padding:'10px 16px',fontWeight:700,color:'var(--text-body)',cursor:'pointer'}}>Back to start</button>
    </div>);
  if (tab === 'otp') return <S.OtpScreen go={go}/>;
  if (tab === 'forgot') return <S.ForgotScreen go={go}/>;
  if (tab === 'register') return <S.RegisterScreen go={go}/>;
  return <S.LoginScreen go={go}/>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
<script src="../shared/appearance.js"></script>
</body></html>
