<!-- @dsCard group="Colors" viewport="700x150" name="Navy Chrome" subtitle="Portal sidebar & app-shell surfaces" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:var(--surface-app);padding:18px;font-family:var(--font-sans)}
  .row{display:flex;gap:12px}
  .sw{flex:1;border-radius:var(--radius-md);height:104px;display:flex;flex-direction:column;justify-content:flex-end;padding:10px}
  .sw b{font-size:12px;font-weight:700;color:#fff}
  .sw span{font-size:11px;color:rgba(255,255,255,.7);font-family:var(--font-mono)}
</style></head>
<body>
  <div class="row">
    <div class="sw" style="background:var(--ml-navy-700)"><b>Navy 700</b><span>#0B2545</span></div>
    <div class="sw" style="background:var(--ml-navy-800)"><b>Sidebar</b><span>#0B192E</span></div>
    <div class="sw" style="background:var(--ml-navy-900)"><b>Navy 900</b><span>#060F20</span></div>
    <div class="sw" style="background:var(--ml-navy-950)"><b>Chrome deep</b><span>#020617</span></div>
    <div class="sw" style="background:linear-gradient(160deg,var(--ml-navy-800),var(--ml-navy-950))"><b>Shell gradient</b><span>800 → 950</span></div>
  </div>
</body></html>
