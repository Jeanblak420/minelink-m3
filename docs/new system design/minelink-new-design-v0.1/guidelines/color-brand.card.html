<!-- @dsCard group="Colors" viewport="700x150" name="Brand & Accent" subtitle="Cyan accent — buttons, links, active nav, icon wells" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:var(--surface-app);padding:18px;font-family:var(--font-sans)}
  .row{display:flex;gap:12px}
  .sw{flex:1;border-radius:var(--radius-md);height:104px;display:flex;flex-direction:column;justify-content:flex-end;padding:10px;box-shadow:var(--shadow-xs)}
  .sw b{font-size:12px;font-weight:700}
  .sw span{font-size:11px;opacity:.8;font-family:var(--font-mono)}
  .dark b,.dark span{color:#fff}
  .light b,.light span{color:var(--text-strong)}
</style></head>
<body>
  <div class="row">
    <div class="sw dark" style="background:var(--ml-cyan-500)"><b>Accent</b><span>#00B5D8</span></div>
    <div class="sw dark" style="background:var(--ml-cyan-600)"><b>Hover</b><span>#0496B6</span></div>
    <div class="sw dark" style="background:var(--ml-cyan-700)"><b>Press</b><span>#0A7791</span></div>
    <div class="sw light" style="background:var(--ml-cyan-100)"><b>Soft</b><span>#CBF3FB</span></div>
    <div class="sw light" style="background:var(--ml-well-cyan);border:1px solid var(--border-card)"><b>Icon well</b><span>#E2F6FB</span></div>
    <div class="sw dark" style="background:var(--ml-teal-700)"><b>Seed teal</b><span>#0F6E8C</span></div>
  </div>
</body></html>
