<!-- @dsCard group="Colors" viewport="700x170" name="Slate Neutrals" subtitle="Backgrounds, borders, body & helper text" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:var(--surface-app);padding:18px;font-family:var(--font-sans)}
  .grid{display:grid;grid-template-columns:repeat(11,1fr);gap:6px}
  .sw{border-radius:var(--radius-sm);height:84px;display:flex;align-items:flex-end;padding:6px;box-shadow:var(--shadow-xs)}
  .sw span{font-size:10px;font-weight:600;font-family:var(--font-mono)}
  .l span{color:var(--text-strong)} .d span{color:#fff}
</style></head>
<body>
  <div class="grid">
    <div class="sw l" style="background:var(--ml-slate-50);border:1px solid var(--border-card)"><span>50</span></div>
    <div class="sw l" style="background:var(--ml-slate-100)"><span>100</span></div>
    <div class="sw l" style="background:var(--ml-slate-200)"><span>200</span></div>
    <div class="sw l" style="background:var(--ml-slate-300)"><span>300</span></div>
    <div class="sw l" style="background:var(--ml-slate-400)"><span>400</span></div>
    <div class="sw d" style="background:var(--ml-slate-500)"><span>500</span></div>
    <div class="sw d" style="background:var(--ml-slate-600)"><span>600</span></div>
    <div class="sw d" style="background:var(--ml-slate-700)"><span>700</span></div>
    <div class="sw d" style="background:var(--ml-slate-800)"><span>800</span></div>
    <div class="sw d" style="background:var(--ml-slate-900)"><span>900</span></div>
    <div class="sw d" style="background:var(--ml-slate-950)"><span>950</span></div>
  </div>
</body></html>
