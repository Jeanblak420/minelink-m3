<!-- @dsCard group="Spacing" viewport="700x150" name="Spacing Scale" subtitle="4px base grid — 4 → 64" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:var(--surface-card);padding:22px;font-family:var(--font-sans)}
  .row{display:flex;align-items:flex-end;gap:14px}
  .item{display:flex;flex-direction:column;align-items:center;gap:6px}
  .bar{background:var(--ml-cyan-500);border-radius:3px;width:22px}
  .n{font-size:11px;color:var(--text-muted);font-family:var(--font-mono)}
</style></head>
<body>
  <div class="row">
    <div class="item"><div class="bar" style="height:4px"></div><span class="n">4</span></div>
    <div class="item"><div class="bar" style="height:8px"></div><span class="n">8</span></div>
    <div class="item"><div class="bar" style="height:12px"></div><span class="n">12</span></div>
    <div class="item"><div class="bar" style="height:16px"></div><span class="n">16</span></div>
    <div class="item"><div class="bar" style="height:20px"></div><span class="n">20</span></div>
    <div class="item"><div class="bar" style="height:24px"></div><span class="n">24</span></div>
    <div class="item"><div class="bar" style="height:32px"></div><span class="n">32</span></div>
    <div class="item"><div class="bar" style="height:40px"></div><span class="n">40</span></div>
    <div class="item"><div class="bar" style="height:48px"></div><span class="n">48</span></div>
    <div class="item"><div class="bar" style="height:64px"></div><span class="n">64</span></div>
  </div>
</body></html>
