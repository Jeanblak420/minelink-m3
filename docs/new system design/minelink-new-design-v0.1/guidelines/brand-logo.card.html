<!-- @dsCard group="Brand" viewport="700x150" name="Logo Lockup" subtitle="Cyan truck mark + MineLink wordmark on navy & light" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,500,1,0&display=swap" rel="stylesheet">
<style>
  body{margin:0;display:flex;gap:0;font-family:var(--font-sans)}
  .pane{flex:1;height:150px;display:flex;align-items:center;justify-content:center;gap:12px}
  .navy{background:linear-gradient(160deg,var(--ml-navy-800),var(--ml-navy-950))}
  .light{background:var(--surface-app)}
  .mark{width:46px;height:46px;border-radius:13px;background:linear-gradient(150deg,var(--ml-cyan-400),var(--ml-cyan-600));display:flex;align-items:center;justify-content:center;box-shadow:0 6px 16px rgba(0,181,216,.35)}
  .mark .ms{font-family:'Material Symbols Rounded';font-size:26px;color:#fff}
  .word{font-size:24px;font-weight:800;letter-spacing:-.01em}
  .on-navy{color:#fff} .on-light{color:var(--text-strong)}
</style></head>
<body>
  <div class="pane navy"><div class="mark"><span class="ms">local_shipping</span></div><span class="word on-navy">MineLink</span></div>
  <div class="pane light"><div class="mark"><span class="ms">local_shipping</span></div><span class="word on-light">MineLink</span></div>
</body></html>
