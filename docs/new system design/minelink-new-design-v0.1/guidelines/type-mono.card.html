<!-- @dsCard group="Type" viewport="700x150" name="Mono — Plates & Codes" subtitle="JetBrains Mono for registrations, tickets, serials" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:var(--surface-card);padding:22px;font-family:var(--font-sans)}
  .row{display:flex;gap:24px;align-items:center;flex-wrap:wrap}
  .plate{font-family:var(--font-mono);font-weight:700;font-size:22px;letter-spacing:var(--ls-plate);color:var(--text-strong)}
  .code{font-family:var(--font-mono);font-size:14px;color:var(--text-muted);background:var(--surface-sunken);padding:6px 10px;border-radius:var(--radius-sm)}
  .lab{font-size:11px;color:var(--text-faint);display:block;margin-bottom:4px;font-family:var(--font-sans)}
</style></head>
<body>
  <div class="row">
    <div><span class="lab">Registration</span><span class="plate">CDF 789 LP</span></div>
    <div><span class="lab">Weighbridge ticket</span><span class="code">WB-0045</span></div>
    <div><span class="lab">Seat serial</span><span class="code">7Kp$92Xv-aQ4mSEC</span></div>
    <div><span class="lab">Time</span><span class="code">09:19</span></div>
  </div>
</body></html>
