<!-- @startingPoint section="Portals" subtitle="Transporter portal — fleet management shell" viewport="1440x900" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><title>MineLink — Transporter Portal</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../../styles.css">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet">
<style>html,body{margin:0;height:100%}body{background:var(--surface-app)}#root{height:100vh}</style>
<script src="../shared/theme.js"></script>
</head><body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel" src="../shared/shell.jsx"></script>
<script type="text/babel" src="../shared/employee-register.jsx"></script>
<script type="text/babel" src="screens.jsx"></script>
<script type="text/babel" src="screens-extra.jsx"></script>
<script type="text/babel">
const { PortalShell } = window.MLShell;
const S = window.TransporterScreens;
const NAV = [
  { key: 'dashboard', label: 'Transporter Portal', icon: 'dashboard' },
  { key: 'fleet', label: 'Fleet / Transport', icon: 'local_shipping' },
  { key: 'routes', label: 'Routes', icon: 'alt_route' },
  { key: 'recons', label: 'Reconciliations', icon: 'balance' },
  { key: 'positions', label: 'Truck Positions', icon: 'place' },
  { key: 'maintenance', label: 'Maintenance', icon: 'build' },
  { key: 'available', label: 'Available Routes', icon: 'explore' },
  { key: 'drivers', label: 'Drivers', icon: 'badge' },
  { key: 'employees', label: 'Employee Register', icon: 'groups' },
];
const META = {
  dashboard: { title: 'Transporter Portal', subtitle: 'Fleet management & logistics overview' },
  fleet: { title: 'Fleet / Transport', subtitle: 'Vehicles, drivers & documents' },
  routes: { title: 'Routes', subtitle: 'Active routes & client assignments' },
  recons: { title: 'Reconciliations', subtitle: 'Load vs delivery variance' },
  positions: { title: 'Truck Positions', subtitle: 'Live GPS view of all vehicles' },
  maintenance: { title: 'Maintenance', subtitle: 'Per-truck records & truck packs' },
  available: { title: 'Available Routes', subtitle: 'Open routes — accept & assign trucks' },
  drivers: { title: 'Drivers', subtitle: 'Driver roster & sign-in management' },
  employees: { title: 'Employee Register', subtitle: 'Your registered staff by role & permission' },
};
function App(){
  const [tab, setTab] = React.useState('dashboard');
  const m = META[tab];
  let body;
  if (tab === 'dashboard') body = <S.TransporterDashboard go={setTab}/>;
  else if (tab === 'fleet') body = <S.TransporterFleet/>;
  else if (tab === 'routes') body = <S.TransporterRoutes onTrip={()=>setTab('positions')}/>;
  else if (tab === 'available') body = <S.TransporterAvailableRoutes/>;
  else if (tab === 'maintenance') body = <S.TransporterMaintenance/>;
  else if (tab === 'drivers') body = <S.TransporterDrivers/>;
  else if (tab === 'employees') body = <window.MLEmployeeRegister.Register otype="Transporter" companyName="Roadhaul Logistics" canManage={true} embedded={true}/>;
  else if (tab === 'positions') body = <S.TransporterPositions/>;
  else if (tab === 'recons') body = <S.TransporterRecons/>;
  else body = <S.TransporterDashboard go={setTab}/>;
  return <PortalShell brand="MineLink" sectionLabel="MAIN" nav={NAV} active={tab} onNav={setTab}
    chatUnread={2} onOpenChat={() => window.location.href='../chat/index.html'}
    user={{ name: 'Roadhaul Ops', role: 'Transporter' }} title={m.title} subtitle={m.subtitle}>{body}</PortalShell>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
<script src="../shared/appearance.js"></script>
</body></html>
