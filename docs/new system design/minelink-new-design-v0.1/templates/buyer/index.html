<!-- @startingPoint section="Portals" subtitle="Buyer portal — full sidebar shell + dashboard" viewport="1440x900" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><title>MineLink — Buyer Portal</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../../styles.css">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet">
<style>html,body{margin:0;height:100%}body{background:var(--surface-app)}#root{height:100vh}</style>
<script src="../shared/theme.js"></script>
</head><body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel" src="../shared/shell.jsx"></script>
<script type="text/babel" src="../shared/employee-register.jsx"></script>
<script type="text/babel" src="screens.jsx"></script>
<script type="text/babel" src="screens-extra.jsx"></script>
<script type="text/babel">
const { PortalShell } = window.MLShell;
const S = window.BuyerScreens;
const NAV = [
  { key: 'dashboard', label: 'Dashboard', icon: 'dashboard' },
  { key: 'products', label: 'My Products', icon: 'inventory' },
  { key: 'employees', label: 'Employee Register', icon: 'badge' },
  { key: 'routes', label: 'Routes & Mines', icon: 'alt_route' },
  { key: 'requests', label: 'Requests', icon: 'assignment' },
  { key: 'waybills', label: 'Waybills', icon: 'description' },
  { key: 'recons', label: 'Reconciliations', icon: 'balance' },
  { key: 'locations', label: 'Truck Locations', icon: 'map' },
];
const META = {
  dashboard: { title: 'Buyer Portal', subtitle: 'Purchase routes, waybills & reconciliation' },
  products: { title: 'My Products', subtitle: 'Your purchased minerals, routes & recons' },
  employees: { title: 'Employee Register', subtitle: 'Your registered staff by role & permission' },
  routes: { title: 'Routes & Mines', subtitle: 'Active routes across mines and offload points' },
  requests: { title: 'Requests', subtitle: 'Request additional mines & buyer connections' },
  waybills: { title: 'Waybills', subtitle: 'Signed delivery notes per trip' },
  recons: { title: 'Reconciliations', subtitle: 'Loaded vs received tonnage' },
  locations: { title: 'Truck Locations', subtitle: '5 trucks · live GPS' },
  'request-new': { title: 'Request Transportation', subtitle: 'New contract-ready haulage request' },
};
function App(){
  const [tab, setTab] = React.useState('dashboard');
  const m = META[tab];
  let body;
  if (tab === 'dashboard') body = <S.BuyerDashboard go={setTab}/>;
  else if (tab === 'products') body = <S.BuyerProducts go={setTab}/>;
  else if (tab === 'employees') body = <window.MLEmployeeRegister.Register otype="Buyer" companyName="Atlas Buyer Group" canManage={true} embedded={true}/>;
  else if (tab === 'routes') body = <S.BuyerRoutesMines go={setTab}/>;
  else if (tab === 'requests') body = <S.RequestTransportation go={setTab}/>;
  else if (tab === 'waybills') body = <S.BuyerWaybillsFull/>;
  else if (tab === 'recons') body = <S.BuyerReconsFull/>;
  else if (tab === 'locations') body = <S.BuyerTruckLocations/>;
  else if (tab === 'request-new') body = <S.RequestTransportation go={setTab}/>;
  else body = <S.BuyerRoutesMines go={setTab}/>;
  const activeNav = tab === 'request-new' ? 'requests' : tab;
  return <PortalShell brand="MineLink" sectionLabel="BUYER PORTAL" nav={NAV} active={activeNav} onNav={setTab}
    chatUnread={3} onOpenChat={() => window.location.href='../chat/index.html'}
    user={{ name: 'Eli the buyer', role: 'Buyer' }} title={m.title} subtitle={m.subtitle}>{body}</PortalShell>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
<script src="../shared/appearance.js"></script>
</body></html>
