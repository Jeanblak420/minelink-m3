<!DOCTYPE html><html><head><meta charset="utf-8"><title>MineLink — Notifications</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../../styles.css">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet">
<style>html,body{margin:0;height:100%}body{background:var(--surface-app)}#root{height:100vh}</style>
</head><body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel" src="../shared/shell.jsx"></script>
<script type="text/babel" src="screens.jsx"></script>
<script type="text/babel">
const { PortalShell } = window.MLShell;
const NAV = [
  { key: 'overview', label: 'Dashboard', icon: 'dashboard' },
  { key: 'notifs', label: 'Notifications', icon: 'notifications', badge: '3' },
  { key: 'chat', label: 'Messages', icon: 'forum' },
];
function App(){
  const [tab, setTab] = React.useState('notifs');
  return <PortalShell brand="MineLink" sectionLabel="MINE" nav={NAV} active="notifs" onNav={setTab}
    chatUnread={5} onOpenChat={() => window.location.href='../chat/index.html'}
    user={{ name: 'Nadia Admin', role: 'Admin · Iron Hills' }} title="Notifications" subtitle="Recent alerts and updates">
    <window.NotifScreens.NotificationsScreen/>
  </PortalShell>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
<script src="../shared/appearance.js"></script>
</body></html>
