<!-- @startingPoint section="Portals" subtitle="Mine / Supplier portal — overview + load control" viewport="1440x900" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><title>MineLink — Mine / Supplier Portal</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../../styles.css">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet">
<style>html,body{margin:0;height:100%}body{background:var(--surface-app)}#root{height:100vh}</style>
<script src="../shared/theme.js"></script>
</head><body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel" src="../shared/shell.jsx"></script>
<script type="text/babel" src="../shared/employee-register.jsx"></script>
<script type="text/babel" src="screens.jsx"></script>
<script type="text/babel" src="screens-detail.jsx"></script>
<script type="text/babel">
const { PortalShell } = window.MLShell;
const S = window.MineScreens;
const NAV = [
  { key: 'overview', label: 'Dashboard', icon: 'dashboard' },
  { key: 'control', label: 'Control', icon: 'tune' },
  { key: 'security', label: 'Security', icon: 'security' },
  { key: 'loading', label: 'Loading Activity', icon: 'local_shipping' },
  { key: 'tonsout', label: 'Tons Out', icon: 'conveyor_belt' },
  { key: 'supervisor', label: 'Supervisor View', icon: 'engineering' },
  { key: 'employees', label: 'Employee Register', icon: 'badge' },
  { key: 'buyers', label: 'Buyers', icon: 'handshake' },
  { key: 'locations', label: 'Truck Locations', icon: 'map' },
];
const META = {
  overview: { title: 'Mine Dashboard', subtitle: 'Tons out, stockpile & buyer overview' },
  control: { title: 'Mine Control', subtitle: 'Record loads and tonnage' },
  security: { title: 'Gate Security', subtitle: 'Mobile app — arrivals & departures' },
  loading: { title: 'Loading Activity', subtitle: 'Incoming, on-site & scheduled trucks' },
  tonsout: { title: 'Tons Out', subtitle: 'Filter by buyer and by day / week / month / year' },
  supervisor: { title: 'Supervisor View', subtitle: 'Foreman & supervisor read-through' },
  employees: { title: 'Employee Register', subtitle: 'Add & manage mine staff by role' },
  buyers: { title: 'Buyers', subtitle: 'Tonnage, recons & invoices per buyer' },
  locations: { title: 'Truck Locations', subtitle: 'Live GPS view' },
};
function App(){
  const [tab, setTab] = React.useState('overview');
  const m = META[tab] || META.overview;
  let body;
  if (tab === 'overview') body = <S.MineOverview go={setTab}/>;
  else if (tab === 'control') body = <S.MineControl/>;
  else if (tab === 'security') body = <S.MineSecurity/>;
  else if (tab === 'loading') body = <S.MineLoadingActivity/>;
  else if (tab === 'tonsout') body = <S.MineTonsOut/>;
  else if (tab === 'supervisor') body = <S.MineSupervisorView go={(t)=>setTab(t==='stockpile'?'overview':t)}/>;
  else if (tab === 'employees') body = <S.MineEmployeeRegister/>;
  else if (tab === 'buyers') body = <S.MineBuyers/>;
  else body = <S.MineOverview go={setTab}/>;
  return <PortalShell brand="MineLink" sectionLabel="MINE" nav={NAV} active={tab} onNav={setTab}
    chatUnread={5} onOpenChat={() => window.location.href='../chat/index.html'}
    user={{ name: 'Iron Hills Mining', role: 'Mine / Supplier' }} title={m.title} subtitle={m.subtitle}>{body}</PortalShell>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
<script src="../shared/appearance.js"></script>
</body></html>
